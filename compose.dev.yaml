# Dev-only Postgres; the prod app+db compose is a separate artifact (decision 0010).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fc2026}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - fc2026_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fc2026}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fc2026_pgdata:
